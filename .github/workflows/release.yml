name: Release

# Publishes to PyPI when a GitHub release is published. PyPI trusts this
# workflow file, in the `pypi` environment, as the package's trusted publisher,
# so it needs no PyPI token, and every file gets a signed attestation.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.2.0
      - name: Check that the tag matches the version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="$(python3 -c 'import re; print(re.search(r"__version__ = \"(.+?)\"", open("src/roicai/_version.py").read())[1])')"
          if [[ "$TAG" != "v$version" ]]; then
            echo "Release tag $TAG does not match src/roicai/_version.py version $version (expected v$version)" >&2
            exit 1
          fi
      - run: uv sync --locked --all-extras
      - run: uv run pytest
        env:
          ROICAI_API_KEY: ${{ secrets.ROICAI_API_KEY }}
      - run: uv build
      - run: uvx twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/roicai/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      # v1.14.2
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33

  attach:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Attach the files to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY"
